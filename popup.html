
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GFG GitHub Sync</title>

    <style>
        body {
            width: 340px;
            padding: 16px;
            font-family: Arial, sans-serif;
            color: #24292f;
            background: #ffffff;
        }

        h2, h3 {
            margin-top: 0;
        }

        h2 {
            font-size: 20px;
        }

        h3 {
            margin-top: 20px;
            font-size: 15px;
        }

        input, button {
            width: 100%;
            box-sizing: border-box;
            padding: 9px;
            margin-top: 8px;
            border-radius: 6px;
        }

        input {
            border: 1px solid #d0d7de;
        }

        button {
            border: none;
            cursor: pointer;
            background: #0969da;
            color: white;
            font-weight: 600;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .secondary {
            background: #57606a;
        }

        .danger {
            background: #cf222e;
        }

        #problem {
            overflow-wrap: anywhere;
            font-size: 13px;
        }

        #status {
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        #updateReview {
            border: 1px solid #d0d7de;
            border-radius: 8px;
            padding: 10px;
            margin-top: 14px;
        }

        #updateReview p {
            font-size: 12px;
            line-height: 1.5;
        }

        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            overflow: auto;
            max-height: 150px;
            padding: 8px;
            border-radius: 5px;
            background: #f6f8fa;
            font-size: 11px;
        }

        .history-item {
            border-top: 1px solid #d8dee4;
            padding: 9px 0;
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .history-item a {
            color: #0969da;
        }

        .muted {
            color: #57606a;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <h2>GFG → GitHub</h2>

    <p id="problem">Open a GeeksforGeeks problem page.</p>

    <label for="token">GitHub Personal Access Token</label>
    <input
        type="password"
        id="token"
        placeholder="Paste GitHub token"
        autocomplete="off"
    >

    <button id="saveToken">Save Token</button>
    
    <hr>

    <h3>GitHub Repository Settings</h3>

    <label for="repoOwner">GitHub Username / Owner</label>
    <input
        type="text"
        id="repoOwner"
        placeholder="Your GitHub username"
    />

    <label for="repoName">Repository Name</label>
    <input
        type="text"
        id="repoName"
        placeholder="Your repository name"
    />

    <label for="repoBranch">Branch</label>
    <input
        type="text"
        id="repoBranch"
        placeholder="main"
    />

    <label for="repoFolder">Destination Folder</label>
    <input
        type="text"
        id="repoFolder"
        placeholder="GFG"
    />

    <button id="saveSettings">Save Settings</button>

    <p id="settingsStatus"></p>

    <hr>

    <button id="syncButton">Sync to GitHub</button>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="updateReview" hidden>
        <h3>Review solution update</h3>
        <p id="reviewDescription"></p>

        <strong>Existing GitHub code</strong>
        <pre id="existingCode"></pre>

        <strong>New GFG code</strong>
        <pre id="newCode"></pre>

        <button id="confirmUpdate" class="danger">
            Confirm Overwrite
        </button>

        <button id="cancelUpdate" class="secondary">
            Cancel
        </button>
    </section>

    <section>
        <h3>Recent Sync History</h3>
        <div id="history">
            <p class="muted">No sync history yet.</p>
        </div>
    </section>

    <script src="popup.js"></script>
</body>
</html>
