<!DOCTYPE html>
<html>
<head>
    <title>GFG GitHub Sync</title>

    <style>
        body {
            width: 300px;
            font-family: Arial, sans-serif;
            padding: 15px;
        }

        h2 {
            margin-top: 0;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
        }

        #status {
            margin-top: 12px;
            font-size: 14px;
        }

        #problem {
            word-wrap: break-word;
        }
    </style>
</head>

<body>

    <h2>GFG → GitHub</h2>

    <p id="problem">Checking problem...</p>

    <label>GitHub Token:</label>

    <input
        type="password"
        id="token"
        placeholder="Paste GitHub PAT"
    >

    <button id="saveToken">
        Save Token
    </button>

    <button id="syncButton">
        Sync to GitHub
    </button>

    <p id="status"></p>

    <script src="popup.js"></script>

</body>
</html>
